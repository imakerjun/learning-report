<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학습 리포트 — Learning Report</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  />
  <style>
    :root {
      --bg: #ffffff;
      --text: #37352f;
      --text-light: #787774;
      --text-faint: #9b9a97;
      --border: #e9e9e7;
      --border-strong: #d3d2ce;
      --subtle: #f7f7f5;
      --hover: #efeeec;
      --accent: #2383e2;
      --up: #448361;
      --up-bg: #ddedea;
      --down: #d9730d;
      --down-bg: #faebdd;
      --faded: #c4554d;
      --faded-bg: #fbeae8;
      --new: #2383e2;
      --new-bg: #ddebf1;
      --neutral: #908d88;
      --neutral-bg: #f1f0ee;
      --radius: 6px;
      --shadow: 0 1px 2px rgba(15, 15, 15, 0.05),
        0 2px 8px rgba(15, 15, 15, 0.04);
      --font: "Pretendard Variable", Pretendard, ui-sans-serif, -apple-system,
        "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --text: #e6e6e4;
        --text-light: #9b9a97;
        --text-faint: #6c6b67;
        --border: #2e2e2c;
        --border-strong: #474743;
        --subtle: #222220;
        --hover: #2a2a28;
        --accent: #5ba3e6;
        --up: #5cab85;
        --up-bg: #1e2b25;
        --down: #dc9145;
        --down-bg: #2d2417;
        --faded: #e16860;
        --faded-bg: #2e1d1c;
        --new: #5ba3e6;
        --new-bg: #1a2733;
        --neutral: #8f8c87;
        --neutral-bg: #262624;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 10px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      font-feature-settings: "tnum";
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 64px 60px 120px;
    }

    /* ── Header ─────────────────────────────────── */
    .doc-icon {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 18px;
      display: block;
    }

    h1.title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15.5px;
      color: var(--text-light);
      max-width: 560px;
      margin-bottom: 20px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-light);
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 9px;
      white-space: nowrap;
    }

    .chip b {
      color: var(--text);
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 32px 0;
      border: none;
    }

    /* ── Section heads ──────────────────────────── */
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }

    h2.section-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .section-desc {
      font-size: 13.5px;
      color: var(--text-faint);
      margin-bottom: 20px;
    }

    /* ── Analysis summary ───────────────────────── */
    .summary {
      display: flex;
      gap: 13px;
      background: var(--subtle);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 36px;
    }

    .summary-icon {
      font-size: 18px;
      line-height: 1.5;
      flex-shrink: 0;
    }

    .summary-text {
      font-size: 14.5px;
      line-height: 1.62;
      color: var(--text);
    }

    .summary-text b {
      font-weight: 600;
    }

    .summary-text .up {
      color: var(--up);
      font-weight: 600;
    }
    .summary-text .down {
      color: var(--down);
      font-weight: 600;
    }
    .summary-text .faded {
      color: var(--faded);
      font-weight: 600;
    }
    .summary-text .new {
      color: var(--new);
      font-weight: 600;
    }

    /* ── Sort filter ────────────────────────────── */
    .sort-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .sort-bar .sort-label {
      font-size: 12.5px;
      color: var(--text-faint);
      margin-right: 3px;
    }

    .sort-btn {
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-light);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 11px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .sort-btn:hover {
      background: var(--subtle);
      color: var(--text);
    }

    .sort-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }

    /* ── KPI cards ──────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    .kpi {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 16px 15px;
      background: var(--bg);
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .kpi:hover {
      box-shadow: var(--shadow);
      border-color: var(--border-strong);
    }

    .kpi-label {
      font-size: 12.5px;
      color: var(--text-light);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kpi-value {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .kpi-value .unit {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
    }

    .kpi-delta {
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 9px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .kpi-delta.up {
      color: var(--up);
    }
    .kpi-delta.down {
      color: var(--down);
    }
    .kpi.faded-accent .kpi-value {
      color: var(--faded);
    }
    .kpi.new-accent .kpi-value {
      color: var(--new);
    }
    .kpi.up-accent .kpi-value {
      color: var(--up);
    }
    .kpi.down-accent .kpi-value {
      color: var(--down);
    }
    .kpi-sub {
      font-size: 12.5px;
      color: var(--text-light);
      margin-top: 9px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Drift list ─────────────────────────────── */
    .drift {
      display: flex;
      flex-direction: column;
    }

    .drift-row {
      display: grid;
      grid-template-columns: 168px 1fr 116px;
      align-items: center;
      gap: 16px;
      padding: 11px 10px;
      border-radius: var(--radius);
      transition: background 0.15s ease;
    }

    .drift-row:hover {
      background: var(--subtle);
    }

    .drift-row.is-faded {
      background: linear-gradient(
        90deg,
        var(--faded-bg) 0%,
        rgba(251, 234, 232, 0) 60%
      );
    }

    .topic-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .is-faded .topic-name {
      color: var(--faded);
    }

    .track-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .track {
      position: relative;
      flex: 1;
      height: 26px;
      background: var(--subtle);
      border-radius: 5px;
      overflow: visible;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 5px;
      width: 0;
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .fill.up {
      background: linear-gradient(90deg, #5a9d7e, var(--up));
    }
    .fill.down {
      background: linear-gradient(90deg, #e2954a, var(--down));
    }
    .fill.flat {
      background: var(--neutral);
    }
    .fill.new {
      background: linear-gradient(90deg, #5ba3e6, var(--new));
    }

    /* baseline ghost marker */
    .baseline-mark {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 0;
      border-left: 2px dashed var(--border-strong);
      z-index: 2;
    }

    .baseline-mark::after {
      content: "기준 " attr(data-base);
      position: absolute;
      top: -17px;
      left: 4px;
      font-size: 10.5px;
      color: var(--text-faint);
      white-space: nowrap;
    }

    .cur-num {
      font-size: 13.5px;
      font-weight: 700;
      min-width: 26px;
      text-align: right;
      color: var(--text);
    }

    .is-faded .cur-num {
      color: var(--faded);
    }

    /* badges */
    .badge {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .badge.up {
      color: var(--up);
      background: var(--up-bg);
    }
    .badge.down {
      color: var(--down);
      background: var(--down-bg);
    }
    .badge.flat {
      color: var(--neutral);
      background: var(--neutral-bg);
    }
    .badge.new {
      color: var(--new);
      background: var(--new-bg);
    }
    .badge.faded {
      color: var(--faded);
      background: var(--faded-bg);
    }

    /* sparkline */
    .spark {
      flex-shrink: 0;
      width: 76px;
      height: 26px;
      display: block;
    }

    /* ── Reflection callout ─────────────────────── */
    .callout {
      margin-top: 44px;
      display: flex;
      gap: 14px;
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }

    .callout-icon {
      font-size: 22px;
      line-height: 1.3;
      flex-shrink: 0;
    }

    .callout-body {
      flex: 1;
    }

    .callout-kicker {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 7px;
    }

    .callout-q {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .answer-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    .answer-box {
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      min-height: 46px;
      line-height: 1.55;
    }

    .answer-box.empty {
      border-style: dashed;
      color: var(--text-faint);
      font-style: normal;
    }

    /* ── footer ─────────────────────────────────── */
    .footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--text-faint);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer a {
      color: var(--text-light);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    /* ── error state ────────────────────────────── */
    .error {
      margin: 80px auto;
      max-width: 520px;
      text-align: center;
      color: var(--text-light);
    }
    .error code {
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 13px;
      color: var(--text);
    }

    /* ── load reveal ────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(8px);
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .fill {
        transition: none;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 40px 22px 80px;
      }
      h1.title {
        font-size: 30px;
      }
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .drift-row {
        grid-template-columns: 110px 1fr;
        gap: 10px;
      }
      .badge {
        grid-column: 2;
        justify-self: start;
        margin-top: 2px;
      }
      .spark {
        display: none;
      }
      .baseline-mark::after {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="root" class="page"></div>

  <script>
    const STATUS = {
      new: { cls: "new", label: "NEW", arrow: "✦" },
      surge: { cls: "up", label: "급증", arrow: "▲▲" },
      up: { cls: "up", label: "증가", arrow: "▲" },
      flat: { cls: "flat", label: "유지", arrow: "→" },
      down: { cls: "down", label: "감소", arrow: "▼" },
      drop: { cls: "down", label: "급감", arrow: "▼▼" },
      faded: { cls: "faded", label: "사라짐", arrow: "✕" },
    };

    function classify(cur, base) {
      if (base === 0 && cur > 0) return "new";
      if (cur === 0 && base > 0) return "faded";
      if (base === 0 && cur === 0) return "flat";
      const r = cur / base;
      if (r >= 1.8) return "surge";
      if (r > 1.1) return "up";
      if (r < 0.4) return "drop";
      if (r < 0.9) return "down";
      return "flat";
    }

    function sparkline(trend) {
      if (!trend || trend.length < 2) return "";
      const w = 76,
        h = 26,
        pad = 3;
      const max = Math.max(...trend, 1);
      const min = Math.min(...trend, 0);
      const span = max - min || 1;
      const step = (w - pad * 2) / (trend.length - 1);
      const pts = trend.map((v, i) => {
        const x = pad + i * step;
        const y = pad + (h - pad * 2) * (1 - (v - min) / span);
        return [x, y];
      });
      const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const last = pts[pts.length - 1];
      const rising = trend[trend.length - 1] >= trend[0];
      const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const col = rising ? (dark ? "#5cab85" : "#448361") : (dark ? "#dc9145" : "#d9730d");
      return (
        '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
        '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>' +
        '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.4" fill="' + col + '"/>' +
        "</svg>"
      );
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    const SORTS = {
      drift: { label: "변화량 큰 순", fn: (a, b) => Math.abs(b.current - b.baseline_avg) - Math.abs(a.current - a.baseline_avg) },
      current: { label: "이번주 빈도", fn: (a, b) => b.current - a.current },
      delta: { label: "증가→감소", fn: (a, b) => b.current - b.baseline_avg - (a.current - a.baseline_avg) },
      name: { label: "이름순", fn: (a, b) => a.name.localeCompare(b.name, "ko") },
    };

    function nameList(arr, max) {
      max = max || 2;
      if (!arr.length) return "없음";
      const names = arr.map((t) => t.name);
      if (names.length <= max) return names.join(", ");
      return names.slice(0, max).join(", ") + " 외 " + (names.length - max) + "개";
    }

    function rowHtml(t, maxVal, animate, idx) {
      const st = classify(t.current, t.baseline_avg);
      const meta = STATUS[st];
      const diff = t.current - t.baseline_avg;
      const fillW = (t.current / maxVal) * 100;
      const baseLeft = (t.baseline_avg / maxVal) * 100;
      const fillCls = st === "new" ? "new" : st === "down" || st === "drop" ? "down" : st === "flat" ? "flat" : "up";
      const showBase = t.baseline_avg > 0;
      const diffStr = st === "new" ? "신규" : st === "faded" ? "−" + t.baseline_avg : (diff >= 0 ? "+" : "") + diff;
      const rev = animate ? " reveal" : "";
      const delay = animate ? ' style="animation-delay:' + (0.18 + idx * 0.045) + 's"' : "";
      return (
        '<div class="drift-row' + rev + (st === "faded" ? " is-faded" : "") + '"' + delay + ">" +
        '<div class="topic-name" title="' + esc(t.name) + '">' + esc(t.name) + "</div>" +
        '<div class="track-wrap">' +
        '<div class="track">' +
        '<div class="fill ' + fillCls + '" data-w="' + fillW.toFixed(1) + '"></div>' +
        (showBase ? '<div class="baseline-mark" data-base="' + t.baseline_avg + '" style="left:' + baseLeft.toFixed(1) + '%"></div>' : "") +
        "</div>" +
        '<span class="cur-num">' + t.current + "</span>" +
        sparkline(t.trend) +
        "</div>" +
        '<span class="badge ' + meta.cls + '">' + meta.arrow + " " + meta.label + " " + diffStr + "</span>" +
        "</div>"
      );
    }

    function applyFills() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.querySelectorAll(".fill").forEach((el) => {
            el.style.width = el.dataset.w + "%";
          });
        });
      });
    }

    function render(data) {
      const m = data.meta || {};
      const topics = (data.topics || []).slice();
      const maxVal = Math.max(1, ...topics.map((t) => Math.max(t.current, t.baseline_avg)));

      // ── 사실 추출 (정렬과 무관하게 데이터에서 직접) ──
      const newOnes = topics.filter((t) => t.baseline_avg === 0 && t.current > 0);
      const fadedOnes = topics.filter((t) => t.current === 0 && t.baseline_avg > 0);
      const existing = topics.filter((t) => t.baseline_avg > 0 && t.current > 0);
      const byDelta = existing.slice().sort((a, b) => b.current - b.baseline_avg - (a.current - a.baseline_avg));
      const topUp = byDelta[0];
      const topUpD = topUp ? topUp.current - topUp.baseline_avg : 0;
      const topDown = byDelta[byDelta.length - 1];
      const topDownD = topDown ? topDown.current - topDown.baseline_avg : 0;
      const rose = topics.filter((t) => t.current - t.baseline_avg > 0).length;
      const fell = topics.filter((t) => t.current - t.baseline_avg < 0).length;

      const kpis = [
        { label: "✦ 새로 등장", big: newOnes.length + "개", accent: "new-accent", sub: newOnes.length ? nameList(newOnes) : "없음" },
        { label: "✕ 사라짐", big: fadedOnes.length + "개", accent: "faded-accent", sub: fadedOnes.length ? nameList(fadedOnes) : "없음" },
        { label: "▲ 가장 크게 늘어난", big: topUp && topUpD > 0 ? "+" + topUpD : "—", accent: "up-accent", sub: topUp && topUpD > 0 ? topUp.name : "없음" },
        { label: "▼ 가장 크게 줄어든", big: topDown && topDownD < 0 ? "" + topDownD : "—", accent: "down-accent", sub: topDown && topDownD < 0 ? topDown.name : "없음" },
      ];

      const kpiHtml = kpis
        .map(
          (k, i) =>
            '<div class="kpi reveal ' + (k.accent || "") + '" style="animation-delay:' + (0.05 + i * 0.04) + 's">' +
            '<div class="kpi-label">' + k.label + "</div>" +
            '<div class="kpi-value">' + esc(k.big) + "</div>" +
            '<div class="kpi-sub">' + esc(k.sub) + "</div>" +
            "</div>"
        )
        .join("");

      // ── 분석 단락 (평가/합성 없이 데이터 사실만 엮음) ──
      const sp = [];
      sp.push("이번주(<b>" + esc(m.current_week || "—") + "</b>) 관심 토픽 <b>" + topics.length + "개</b>를 " + esc(m.baseline_label || "직전 평균") + "과 견줬다.");
      const clauses = [];
      if (newOnes.length) clauses.push('<span class="new">' + esc(nameList(newOnes)) + "</span> " + newOnes.length + "개가 새로 등장했고");
      if (fadedOnes.length) clauses.push('<span class="faded">' + esc(nameList(fadedOnes)) + "</span> " + fadedOnes.length + "개가 사라졌다");
      if (clauses.length) sp.push(clauses.join(", ") + ".");
      if (topUp && topUpD > 0) {
        let mv = '가장 크게 늘어난 토픽은 <span class="up">' + esc(topUp.name) + " (+" + topUpD + ")</span>";
        if (topDown && topDownD < 0) mv += ', 가장 크게 줄어든 토픽은 <span class="down">' + esc(topDown.name) + " (" + topDownD + ")</span>";
        sp.push(mv + "다.");
      }
      sp.push("전체적으로 <b>증가·신규 " + rose + "개</b>, <b>감소·소멸 " + fell + "개</b>로 관심사가 움직였다.");
      const summaryHtml =
        '<div class="summary reveal" style="animation-delay:0.12s">' +
        '<span class="summary-icon">🧭</span>' +
        '<div class="summary-text">' + sp.join(" ") + "</div>" +
        "</div>";

      const baseWeeks = m.baseline_weeks || 4;
      const baseDef =
        "막대 = 이번주 등장 빈도 · 점선 = 기준선(직전 " +
        baseWeeks +
        "주간 주당 평균 등장 횟수) · 둘의 간격이 곧 이동(drift)이다.";

      const sortHtml =
        '<div class="sort-bar reveal" style="animation-delay:0.2s">' +
        '<span class="sort-label">정렬</span>' +
        Object.keys(SORTS)
          .map((k) => '<button class="sort-btn" data-sort="' + k + '">' + SORTS[k].label + "</button>")
          .join("") +
        "</div>";

      document.getElementById("root").innerHTML =
        '<span class="doc-icon reveal">📊</span>' +
        '<h1 class="title reveal" style="animation-delay:0.03s">학습 리포트</h1>' +
        '<p class="subtitle reveal" style="animation-delay:0.06s">이번주 관심 토픽이 직전 기준선에서 <b>어디로 얼마나 움직였는가</b>를 본다. 빈도가 아니라 <b>변화량</b>이 학습 신호다.</p>' +
        '<div class="meta-row reveal" style="animation-delay:0.09s">' +
        '<span class="chip">📅 <b>' + esc(m.current_week || "—") + "</b></span>" +
        '<span class="chip">기준선 <b>' + esc(m.baseline_label || "직전 평균") + "</b></span>" +
        (m.owner ? '<span class="chip">👤 <b>' + esc(m.owner) + "</b></span>" : "") +
        '<span class="chip">생성 ' + esc(m.generated_at || "") + "</span>" +
        "</div>" +
        '<hr class="divider" />' +
        summaryHtml +
        '<div class="kpi-grid">' + kpiHtml + "</div>" +
        '<div class="section-head"><h2 class="section-title">토픽 변화량</h2></div>' +
        '<p class="section-desc">' + baseDef + "</p>" +
        sortHtml +
        '<div class="drift" id="drift"></div>' +
        '<div class="footer reveal" style="animation-delay:0.55s">' +
        "<span>데이터 출처: " + esc(m.source || "—") + "</span>" +
        '<span>learning-report · 단일 HTML 템플릿</span>' +
        "</div>";

      // ── 정렬 가능한 드리프트 리스트 ──
      const driftEl = document.getElementById("drift");
      let activeSort = "drift";
      function renderRows(key, animate) {
        activeSort = key;
        const sorted = topics.slice().sort(SORTS[key].fn);
        driftEl.innerHTML = sorted.map((t, i) => rowHtml(t, maxVal, animate, i)).join("");
        document.querySelectorAll(".sort-btn").forEach((b) => b.classList.toggle("active", b.dataset.sort === key));
        applyFills();
      }
      document.querySelectorAll(".sort-btn").forEach((b) => {
        b.addEventListener("click", () => renderRows(b.dataset.sort, false));
      });
      renderRows("drift", true);
    }

    function renderError(msg) {
      document.getElementById("root").innerHTML =
        '<div class="error"><span class="doc-icon">📊</span>' +
        "<h1 class='title' style='font-size:24px'>데이터를 불러오지 못했습니다</h1>" +
        "<p style='margin-top:12px'>" + esc(msg) + "</p>" +
        "<p style='margin-top:16px'>로컬에서 열 때는 정적 서버로 실행하세요:<br/><br/><code>python3 -m http.server 8080</code></p></div>";
    }

    async function boot() {
      // report.json(참여자 실데이터)을 먼저, 없으면 sample.json(데모)
      for (const path of ["./data/report.json", "./data/sample.json"]) {
        try {
          const res = await fetch(path, { cache: "no-store" });
          if (res.ok) {
            render(await res.json());
            return;
          }
        } catch (e) {
          /* try next */
        }
      }
      renderError("data/report.json 또는 data/sample.json을 찾을 수 없습니다.");
    }

    boot();
  </script>
</body>
</html>
